name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_ENABLED: "false"
      AI_PROVIDER: fallback
      OPENAI_API_KEY: ""
      NVIDIA_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev,ai]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Synthetic tests and coverage
        run: >-
          python -m pytest -m "not full_data"
          --cov=moneygraph
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Synthetic pipeline and API contracts
        run: python -m pytest -q tests/test_cli.py tests/test_api.py

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag freedom-moneygraph-aml:ci .
