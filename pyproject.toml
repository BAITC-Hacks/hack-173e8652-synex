[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedom-moneygraph-aml"
version = "0.1.0"
description = "Deterministic graph analytics workspace for AML investigation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "networkx>=3.3,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
  "pyarrow>=16,<22",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "scipy>=1.15,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.41,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
ai = ["openai>=1.60,<3.0"]
dev = [
  "mypy>=1.14,<2.0",
  "pandas-stubs>=2.2,<3.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
moneygraph = "moneygraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "full_data: uses the repository's full hackathon dataset",
  "e2e: exercises multiple application layers",
]

[tool.coverage.run]
branch = true
source = ["moneygraph"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["out", "artifacts", "starter", "src/freedom_moneygraph_aml.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["moneygraph"]
strict = true
warn_unreachable = true
ignore_missing_imports = true
